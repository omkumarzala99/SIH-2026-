version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: moil_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moil_user
      POSTGRES_PASSWORD: moil_secure_password
      POSTGRES_DB: moil_mining
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moil_user -d moil_mining"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moil_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=demo
      - ENVIRONMENT=production
      - PORT=8000
      - DATABASE_URL=postgresql://moil_user:moil_secure_password@database:5432/moil_mining
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./ai_ml/models:/app/ai_ml/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    container_name: moil_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
