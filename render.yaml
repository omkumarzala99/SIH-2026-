# Render Blueprint Specification for MOIL AI Mining Intelligence Platform
# Deployment documentation: https://render.com/docs/blueprint-spec
services:
  # 1. Backend FastAPI Service (Dockerized)
  - type: web
    name: moil-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_MODE
        value: demo
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: moil-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # 2. Frontend React / Vite Static Site
  - type: web
    name: moil-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: moil-backend
          property: url
          suffix: /api

databases:
  # 3. Managed PostgreSQL Database
  - name: moil-postgres
    databaseName: moil_mining
    user: moil_user
    plan: free
    region: singapore
